
name: nutri_calc
description: Your Nutri Calculator and Guide
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.6

  # Charts
  fl_chart: ^0.68.0

  # Date formatting
  intl: ^0.19.0

  # Database
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#00897B"  # Teal color
  adaptive_icon_foreground: "assets/icon/app_icon.png"


flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
